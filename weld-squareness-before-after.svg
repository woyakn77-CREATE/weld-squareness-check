<svg xmlns="http://www.w3.org/2000/svg" width="380" height="1600" viewBox="0 0 380 1600" role="img">
<title>Weld squareness check: before vs after</title>
<desc>Before: square check and cross corner check each branch on a decision. No gap or equal diagonals means continue. A gap or unequal diagonals gets measured, but with no limit defined there is no way to judge it. After: the tool calculates the corner angle and gives pass or fail against plus or minus 0.5 degree.</desc>
<style>
text{font-family:"Segoe UI",Helvetica,Arial,"Liberation Sans","DejaVu Sans",sans-serif;text-anchor:middle;dominant-baseline:central}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#F8F7F3;stroke:#888780}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}
.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="380" height="1600" fill="#FFFFFF"/>
<g class="c-coral"><rect x="40" y="20" width="300" height="44" rx="8" stroke-width="0.5"/><text class="th" x="190" y="42">Before: current method</text></g>
<line x1="190" y1="66" x2="190" y2="86" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="40" y="88" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="190" y="108">Locate on fixture table</text><text class="ts" x="190" y="126">Guide pins set position</text>
<line x1="190" y1="146" x2="190" y2="166" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="40" y="168" width="300" height="44" rx="8" stroke-width="0.5"/><text class="th" x="190" y="190">Clamp pieces in place</text>
<line x1="190" y1="214" x2="190" y2="234" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="40" y="236" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="190" y="256">Square each corner</text><text class="ts" x="190" y="274">6 x 9 in machinist square</text>
<line x1="190" y1="294" x2="190" y2="306" class="arr" marker-end="url(#arrow)"/>
<polygon class="box" points="190,308 280,340 190,372 100,340" stroke-width="0.5"/><text class="th" x="190" y="340">Gap visible?</text>
<path d="M190 372 L190 392 L110 392 L110 406" class="arr" marker-end="url(#arrow)"/>
<path d="M190 372 L190 392 L270 392 L270 406" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="146" y="382">No</text><text class="ts" x="234" y="382">Yes</text>
<g class="c-teal"><rect x="40" y="408" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="110" y="428">Square</text><text class="ts" x="110" y="446">Continue</text></g>
<rect class="box" x="200" y="408" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="270" y="428">Measure gap</text><text class="ts" x="270" y="446">Feeler gauge</text>
<line x1="270" y1="466" x2="270" y2="486" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="200" y="488" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="270" y="508">No limit set</text><text class="ts" x="270" y="526">Can't judge if OK</text></g>
<path d="M110 466 L110 568 L190 568 L190 582" class="arr" marker-end="url(#arrow)"/>
<path d="M270 546 L270 568 L190 568 L190 582" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="40" y="584" width="300" height="44" rx="8" stroke-width="0.5"/><text class="th" x="190" y="606">Measure cross corners</text>
<line x1="190" y1="630" x2="190" y2="642" class="arr" marker-end="url(#arrow)"/>
<polygon class="box" points="190,644 280,676 190,708 100,676" stroke-width="0.5"/><text class="th" x="190" y="676">Diagonals equal?</text>
<path d="M190 708 L190 728 L110 728 L110 742" class="arr" marker-end="url(#arrow)"/>
<path d="M190 708 L190 728 L270 728 L270 742" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="146" y="718">Yes</text><text class="ts" x="234" y="718">No</text>
<g class="c-teal"><rect x="40" y="744" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="110" y="764">Square</text><text class="ts" x="110" y="782">Continue</text></g>
<rect class="box" x="200" y="744" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="270" y="764">Measure diff</text><text class="ts" x="270" y="782">Tape measure</text>
<line x1="270" y1="802" x2="270" y2="822" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="200" y="824" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="270" y="844">No limit set</text><text class="ts" x="270" y="862">Can't judge if OK</text></g>
<path d="M110 802 L110 904 L190 904 L190 918" class="arr" marker-end="url(#arrow)"/>
<path d="M270 882 L270 904 L190 904 L190 918" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="40" y="920" width="300" height="44" rx="8" stroke-width="0.5"/><text class="th" x="190" y="942">Subjective accept or reject</text></g>
<line x1="190" y1="966" x2="190" y2="986" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="40" y="988" width="300" height="76" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="190" y="1008">Gap found: what 0.5° means</text><text class="ts" x="190" y="1028">0.079 in gap at end of 9 in blade</text><text class="ts" x="190" y="1046">0.35 in diagonal diff, 24 x 36 frame</text>
<line x1="190" y1="1066" x2="190" y2="1086" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="1088" width="300" height="44" rx="8" stroke-width="0.5"/><text class="th" x="190" y="1110">After: Squareness Check tool</text></g>
<line x1="190" y1="1134" x2="190" y2="1154" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="40" y="1156" width="300" height="44" rx="8" stroke-width="0.5"/><text class="th" x="190" y="1178">Locate and clamp on table</text>
<line x1="190" y1="1202" x2="190" y2="1222" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="40" y="1224" width="300" height="44" rx="8" stroke-width="0.5"/><text class="th" x="190" y="1246">Measure sides and diagonals</text>
<line x1="190" y1="1270" x2="190" y2="1290" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="1292" width="300" height="44" rx="8" stroke-width="0.5"/><text class="th" x="190" y="1314">Enter values in tool</text></g>
<line x1="190" y1="1338" x2="190" y2="1358" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="1360" width="300" height="44" rx="8" stroke-width="0.5"/><text class="th" x="190" y="1382">Tool calculates corner angle</text></g>
<line x1="190" y1="1406" x2="190" y2="1418" class="arr" marker-end="url(#arrow)"/>
<polygon class="box" points="190,1420 280,1452 190,1484 100,1452" stroke-width="0.5"/><text class="th" x="190" y="1452">Within ±0.5°?</text>
<path d="M190 1484 L190 1504 L110 1504 L110 1518" class="arr" marker-end="url(#arrow)"/>
<path d="M190 1484 L190 1504 L270 1504 L270 1518" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="146" y="1494">Yes</text><text class="ts" x="234" y="1494">No</text>
<g class="c-teal"><rect x="40" y="1520" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="110" y="1540">Pass</text><text class="ts" x="110" y="1558">Final weld</text></g>
<g class="c-coral"><rect x="200" y="1520" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="270" y="1540">Fail</text><text class="ts" x="270" y="1558">Adjust, recheck</text></g>
</svg>
